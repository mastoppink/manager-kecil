<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — manager-kecil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/studio.css') }}">
</head>
<body class="studio">
<main class="st-auth">
  <div class="st-card st-auth-card">
    <div class="st-brand" style="justify-content:center"><span class="st-brand-mark"></span>manager-kecil</div>
    <h1 class="st-auth-title">Masuk</h1>
    <p class="st-auth-sub">Masukkan PIN untuk membuka Studio.</p>
    <form method="POST" action="/login" class="st-stack">
      <div class="st-field">
        <label class="st-label" for="pin">PIN</label>
        <input class="st-input" type="password" id="pin" name="password" required autofocus autocomplete="current-password">
      </div>
      {% if error %}<p class="st-auth-error" role="alert">{{ error }}</p>{% endif %}
      <button class="st-btn st-btn-primary" type="submit" style="width:100%">Masuk</button>
    </form>
  </div>
</main>
</body>
</html>
